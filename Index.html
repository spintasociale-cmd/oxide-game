<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxide Case Opener</title>
    <!-- Carichiamo lo script ufficiale di Telegram per le Mini App -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ff9800;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .stats {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 18px;
            border: 1px solid #3d3d3d;
        }
        .cassa-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .btn-cassa {
            width: 90%;
            max-width: 350px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn-cassa:active {
            transform: scale(0.95);
        }
        .risorse { background-color: #4caf50; }
        .epica { background-color: #9c27b0; }
        .leggendaria { background-color: #ff9800; }

        /* Schermata di Sblocco Animata */
        .display-box {
            margin-top: 30px;
            min-height: 120px;
            background: #222;
            border: 2px dashed #444;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .loot-anim {
            font-size: 50px;
        }
        .loot-nome {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
        /* Animazione terremoto per la cassa */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shaking {
            animation: shake 0.5s;
            animation-iteration-count: infinite;
        }
    </style>
</head>
<body>

    <h1>OXIDE MINI APP</h1>
    <div class="subtitle">Case Opener Simulator</div>

    <div class="stats">
        💰 Monete: <span id="conto-monete">1000</span>
    </div>

    <div class="cassa-container">
        <button class="btn-cassa risorse" onclick="tentaApertura('risorse', 100)">📦 Cassa Risorse (100 💰)</button>
        <button class="btn-cassa epica" onclick="tentaApertura('epica', 500)">🟣 Cassa Epica (500 💰)</button>
        <button class="btn-cassa leggendaria" onclick="tentaApertura('leggendaria', 1200)">👑 Cassa Leggendaria (1200 💰)</button>
    </div>

    <div class="display-box" id="box-sblocco">
        <div id="icona-stato" class="loot-anim">🏕️</div>
        <div id="testo-stato" class="loot-nome">Pronto a scassinare?</div>
    </div>

    <script>
        // Comunichiamo a Telegram di espandere la Mini App a tutto schermo
        const tg = window.Telegram.WebApp;
        tg.expand();

        let monete = 1000;
        
        // Database Oggetti Oxide
        const loot = {
            risorse: [
                {nome: "Legno 🪵", emoji: "🪵"},
                {nome: "Zolfo 🟡", emoji: "🟡"}
            ],
            epica: [
                {nome: "Fucile LR-300 🔫", emoji: "🔫"},
                {nome: "Armatura Metallo 🛡️", emoji: "🛡️"},
                {nome: "Porta di Metallo 🚪", emoji: "🚪"}
            ],
            leggendaria: [
                {nome: "Esplosivo C4 💣", emoji: "💣"},
                {nome: "Skin M4 Dorata ✨", emoji: "✨"}
            ]
        };

        function tentaApertura(tipo, costo) {
            if (monete < costo) {
                document.getElementById('icona-stato').innerText = "❌";
                document.getElementById('testo-stato').innerText = "Monete insufficienti!";
                return;
            }

            // Scala le monete
            monete -= costo;
            document.getElementById('conto-monete').innerText = monete;

            // Avvia animazione di apertura
            const box = document.getElementById('box-sblocco');
            const icona = document.getElementById('icona-stato');
            const testo = document.getElementById('testo-stato');
            
            box.classList.add('shaking');
            icona.innerText = "🛠️";
            testo.innerText = "Scassinando la cassa...";

            // Dopo 1,5 secondi mostra il premio (simula l'attesa del drop)
            setTimeout(() => {
                box.classList.remove('shaking');
                
                const pool = loot[tipo];
                const premio = pool[Math.floor(Math.random() * pool.length)];
                
                icona.innerText = premio.emoji;
                testo.innerText = "Hai trovato: " + premio.nome;
                
                // Manda una notifica a vibrazione sul telefono se supportata da Telegram
                if(tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }, 1500);
        }
    </script>
</body>
</html>
